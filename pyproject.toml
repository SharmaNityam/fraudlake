[project]
name = "fraudlake"
version = "0.1.0"
description = "Production-style fraud detection pipeline: PySpark ingestion, Postgres SQL feature marts, gradient-boosted trees with time-aware validation."
authors = [{ name = "Nityam Sharma" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark>=3.5,<3.6",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "catboost>=1.2",
    "optuna>=4.0",
    "mlflow>=2.17",
    "shap>=0.46",
    "numba>=0.60",
    "llvmlite>=0.43",
    "typer>=0.12",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "kaggle>=1.6",
    "rich>=13",
    "matplotlib>=3.9",
    "setuptools>=70",  # pyspark 3.5 imports distutils; removed in py3.12
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "seaborn>=0.13", "nbconvert>=7"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
    "pre-commit>=3",
]

[project.scripts]
fraudlake = "fraudlake.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "spark: tests that spin up a local SparkSession",
    "postgres: tests that need a Postgres container",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
