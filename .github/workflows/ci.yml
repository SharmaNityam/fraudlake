name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --group dev
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test (synthetic fixture; Spark local + Postgres via testcontainers)
        run: uv run pytest -q
        env:
          FRAUDLAKE_SPARK_DRIVER_MEMORY: 2g
