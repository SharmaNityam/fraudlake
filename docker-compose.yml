services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudlake-postgres
    environment:
      POSTGRES_DB: ${FRAUDLAKE_PG_DB:-fraudlake}
      POSTGRES_USER: ${FRAUDLAKE_PG_USER:-fraudlake}
      POSTGRES_PASSWORD: ${FRAUDLAKE_PG_PASSWORD:-fraudlake}
    ports:
      - "${FRAUDLAKE_PG_PORT:-5433}:5432"
    volumes:
      - fraudlake_pgdata:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=1GB -c work_mem=256MB -c maintenance_work_mem=512MB
               -c max_wal_size=2GB -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FRAUDLAKE_PG_USER:-fraudlake} -d ${FRAUDLAKE_PG_DB:-fraudlake}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fraudlake_pgdata:
